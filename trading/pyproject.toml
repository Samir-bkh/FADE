[project]
name = "fade-trader"
version = "0.1.0"
description = "Agent de trading crypto : cerveau (Claude Opus 5.5) / réflexe (Jev) / risque déterministe"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
brain = ["anthropic>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
fade-trader = "fade_trader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fade_trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
